# Docker Compose Configuration for the Diabetes Prediction Microservices
# Services: frontend, backend API, ML prediction, authentication, verification,
# validation, authorization, and a shared PostgreSQL database.
# All services run in isolated containers and communicate via Docker networking.

services:
  # Frontend service - Flask web application for user interface
  front-end:
    build:
      context: ./frontend
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: dev-secret-change-me
      BACKEND_URL: http://backend:5001
      AUTH_SERVICE_URL: http://auth-service:5002
      VERIFICATION_SERVICE_URL: http://verification-service:5003
    depends_on:
      - backend
      - auth-service
      - verification-service

  # Backend service - Flask API for diabetes prediction
  backend:
    build:
      context: ./backend
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_NAME: microservices_db
      DB_USER: postgres
      DB_PASSWORD: password
      AUTHORIZATION_SERVICE_URL: http://authorization-service:5005
      VALIDATION_SERVICE_URL: http://validation-service:5004
    depends_on:
      - db
      - authorization-service
      - validation-service

  # Authentication microservice - registration, login, JWT issuance
  auth-service:
    build:
      context: ./auth-service
    ports:
      - "5002:5002"
    environment:
      DB_HOST: db
      DB_NAME: microservices_db
      DB_USER: postgres
      DB_PASSWORD: password
      JWT_SECRET: dev-secret-change-me
      VERIFICATION_SERVICE_URL: http://verification-service:5003
    depends_on:
      - db

  # Verification microservice - one-time account verification codes
  verification-service:
    build:
      context: ./verification-service
    ports:
      - "5003:5003"
    environment:
      DB_HOST: db
      DB_NAME: microservices_db
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      - db

  # Validation microservice - checks prediction input is well-formed
  validation-service:
    build:
      context: ./validation-service
    ports:
      - "5004:5004"

  # Authorization microservice - checks JWT + role permissions
  authorization-service:
    build:
      context: ./authorization-service
    ports:
      - "5005:5005"
    environment:
      JWT_SECRET: dev-secret-change-me

  # Database service - PostgreSQL for storing users, verification codes and predictions
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Auto-creates the users/verification_codes/predictions tables on first boot.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

# Define named volumes for data persistence
volumes:
  db-data:
