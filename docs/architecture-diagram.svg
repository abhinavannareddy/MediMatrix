<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/>
    </marker>
    <marker id="arrowteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e9aa7"/>
    </marker>
  </defs>

  <rect width="1040" height="830" fill="#ffffff"/>

  <!-- ================= Kubernetes cluster boundary ================= -->
  <rect x="8" y="112" width="1024" height="488" rx="12" fill="#f7f9fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="24" y="136" font-size="12.5" font-weight="700" fill="#2a78d6" letter-spacing="0.06em">KUBERNETES CLUSTER &#183; namespace: medimatrx</text>
  <text x="24" y="153" font-size="10.5" fill="#6b7280">16 NetworkPolicy objects: default-deny-all plus 15 explicit allows (DNS + one pair per legitimate call). ClusterIP everywhere except the gateway.</text>

  <!-- ================= Browser (outside) ================= -->
  <rect x="380" y="20" width="280" height="56" rx="9" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="520" y="44" text-anchor="middle" font-size="14" font-weight="650" fill="#0b0b0b">Hospital estates manager</text>
  <text x="520" y="63" text-anchor="middle" font-size="12" fill="#52514e">web browser</text>

  <!-- browser -> gateway -->
  <line x1="520" y1="76" x2="520" y2="164" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="530" y="106" width="176" height="20" rx="4" fill="#ffffff"/>
  <text x="536" y="121" font-size="11.5" fill="#52514e">HTTP :30080 (NodePort)</text>

  <!-- ================= Gateway ================= -->
  <rect x="340" y="166" width="360" height="74" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <rect x="340" y="166" width="6" height="74" rx="3" fill="#2a78d6"/>
  <text x="360" y="192" font-size="14.5" font-weight="700" fill="#0b0b0b">API GATEWAY</text>
  <text x="360" y="211" font-size="12" fill="#52514e">Node.js / Express &#183; 2-10 replicas</text>
  <text x="360" y="229" font-size="11.5" fill="#898781">only externally reachable service &#183; routing, rate limit, security headers</text>
  <text x="685" y="192" text-anchor="end" font-size="11" font-weight="700" fill="#2a78d6">C1</text>

  <!-- gateway -> distribution bus -> nine services -->
  <line x1="520" y1="240" x2="520" y2="262" stroke="#52514e" stroke-width="1.6"/>
  <line x1="70" y1="262" x2="963" y2="262" stroke="#52514e" stroke-width="1.6"/>
  <line x1="70" y1="262" x2="70" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="186" y1="262" x2="186" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="302" y1="262" x2="302" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="418" y1="262" x2="418" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="555" y1="262" x2="555" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="657" y1="262" x2="657" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="759" y1="262" x2="759" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="861" y1="262" x2="861" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="963" y1="262" x2="963" y2="298" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tier labels -->
  <text x="20" y="291" font-size="10.5" font-weight="700" fill="#52514e" letter-spacing="0.05em">TIER 1 &#183; owns something</text>
  <text x="508" y="291" font-size="10.5" font-weight="700" fill="#52514e" letter-spacing="0.05em">TIER 2 &#183; reads only, builds on Tier 1</text>
  <line x1="486" y1="278" x2="486" y2="412" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- ================= C2 Ingest (Tier 1) ================= -->
  <rect x="20" y="300" width="100" height="110" rx="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
  <rect x="20" y="300" width="6" height="110" rx="3" fill="#2a78d6"/>
  <text x="34" y="320" font-size="12" font-weight="700" fill="#0b0b0b">INGEST</text>
  <text x="34" y="335" font-size="9" fill="#52514e">Node.js &#183; 2-12 repl.</text>
  <text x="34" y="352" font-size="9.5" font-weight="650" fill="#2a78d6">owns the database</text>
  <text x="34" y="365" font-size="8.5" fill="#898781">readings collection</text>
  <text x="34" y="378" font-size="8.5" fill="#898781">+ summaries</text>
  <text x="112" y="402" text-anchor="end" font-size="10.5" font-weight="700" fill="#2a78d6">C2</text>

  <!-- ================= C7 Auth (Tier 1) ================= -->
  <rect x="136" y="300" width="100" height="110" rx="9" fill="#ffffff" stroke="#c9992e" stroke-width="1.8"/>
  <rect x="136" y="300" width="6" height="110" rx="3" fill="#c9992e"/>
  <text x="150" y="320" font-size="12" font-weight="700" fill="#0b0b0b">AUTH</text>
  <text x="150" y="335" font-size="9" fill="#52514e">Python &#183; 2-8 repl.</text>
  <text x="150" y="352" font-size="9.5" font-weight="650" fill="#c9992e">owns the database</text>
  <text x="150" y="365" font-size="8.5" fill="#898781">users + verification_</text>
  <text x="150" y="378" font-size="8.5" fill="#898781">codes collections</text>
  <text x="228" y="402" text-anchor="end" font-size="10.5" font-weight="700" fill="#c9992e">C7</text>

  <!-- ================= C3 Price (Tier 1) ================= -->
  <rect x="252" y="300" width="100" height="110" rx="9" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/>
  <rect x="252" y="300" width="6" height="110" rx="3" fill="#1baf7a"/>
  <text x="266" y="320" font-size="12" font-weight="700" fill="#0b0b0b">PRICE</text>
  <text x="266" y="335" font-size="9" fill="#52514e">Python &#183; 2-4 repl.</text>
  <text x="266" y="352" font-size="9.5" font-weight="650" fill="#1baf7a">15-min cache</text>
  <text x="266" y="365" font-size="8.5" fill="#898781">day-ahead SE1-SE4</text>
  <text x="266" y="378" font-size="8.5" fill="#898781">+ modelled fallback</text>
  <text x="344" y="402" text-anchor="end" font-size="10.5" font-weight="700" fill="#1baf7a">C3</text>

  <!-- ================= C4 Optimizer (Tier 1) ================= -->
  <rect x="368" y="300" width="100" height="110" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/>
  <rect x="368" y="300" width="6" height="110" rx="3" fill="#eb6834"/>
  <text x="382" y="320" font-size="12" font-weight="700" fill="#0b0b0b">OPTIMIZER</text>
  <text x="382" y="335" font-size="9" fill="#52514e">Python &#183; 2-15 repl.</text>
  <text x="382" y="352" font-size="9.5" font-weight="650" fill="#eb6834">owns the algorithm</text>
  <text x="382" y="365" font-size="8.5" fill="#898781">stateless, no</text>
  <text x="382" y="378" font-size="8.5" fill="#898781">database of its own</text>
  <text x="460" y="402" text-anchor="end" font-size="10.5" font-weight="700" fill="#eb6834">C4</text>

  <!-- ================= C5 Assistant (Tier 2) ================= -->
  <rect x="508" y="300" width="94" height="110" rx="9" fill="#ffffff" stroke="#7a5af0" stroke-width="1.8"/>
  <rect x="508" y="300" width="6" height="110" rx="3" fill="#7a5af0"/>
  <text x="521" y="320" font-size="11.5" font-weight="700" fill="#0b0b0b">ASSISTANT</text>
  <text x="521" y="335" font-size="8.7" fill="#52514e">Python &#183; 2-10 repl.</text>
  <text x="521" y="352" font-size="9" font-weight="650" fill="#7a5af0">read-only</text>
  <text x="521" y="365" font-size="8.3" fill="#898781">reads C2, C3, C4</text>
  <text x="521" y="378" font-size="8.3" fill="#898781">no write path</text>
  <text x="594" y="402" text-anchor="end" font-size="10" font-weight="700" fill="#7a5af0">C5</text>

  <!-- ================= C6 Forecast (Tier 2) ================= -->
  <rect x="610" y="300" width="94" height="110" rx="9" fill="#ffffff" stroke="#0e9aa7" stroke-width="1.8"/>
  <rect x="610" y="300" width="6" height="110" rx="3" fill="#0e9aa7"/>
  <text x="623" y="320" font-size="11.5" font-weight="700" fill="#0b0b0b">FORECAST</text>
  <text x="623" y="335" font-size="8.7" fill="#52514e">Python &#183; 2-4 repl.</text>
  <text x="623" y="352" font-size="9" font-weight="650" fill="#0e9aa7">plans tomorrow</text>
  <text x="623" y="365" font-size="8.3" fill="#898781">reads C3, posts</text>
  <text x="623" y="378" font-size="8.3" fill="#898781">a scenario to C4</text>
  <text x="696" y="402" text-anchor="end" font-size="10" font-weight="700" fill="#0e9aa7">C6</text>

  <!-- ================= C8 Verification (Tier 2) ================= -->
  <rect x="712" y="300" width="94" height="110" rx="9" fill="#ffffff" stroke="#d6336c" stroke-width="1.8"/>
  <rect x="712" y="300" width="6" height="110" rx="3" fill="#d6336c"/>
  <text x="725" y="320" font-size="11.5" font-weight="700" fill="#0b0b0b">VERIFICATION</text>
  <text x="725" y="335" font-size="8.7" fill="#52514e">Python &#183; 2-8 repl.</text>
  <text x="725" y="352" font-size="9" font-weight="650" fill="#d6336c">stateless</text>
  <text x="725" y="365" font-size="8.3" fill="#898781">asks C7 to store /</text>
  <text x="725" y="378" font-size="8.3" fill="#898781">check one-time codes</text>
  <text x="798" y="402" text-anchor="end" font-size="10" font-weight="700" fill="#d6336c">C8</text>

  <!-- ================= C9 Validation (Tier 2) ================= -->
  <rect x="814" y="300" width="94" height="110" rx="9" fill="#ffffff" stroke="#7d8a4a" stroke-width="1.8"/>
  <rect x="814" y="300" width="6" height="110" rx="3" fill="#7d8a4a"/>
  <text x="827" y="320" font-size="11.5" font-weight="700" fill="#0b0b0b">VALIDATION</text>
  <text x="827" y="335" font-size="8.7" fill="#52514e">Python &#183; 2-12 repl.</text>
  <text x="827" y="352" font-size="9" font-weight="650" fill="#7d8a4a">checked pre-write</text>
  <text x="827" y="365" font-size="8.3" fill="#898781">reads C2's zone</text>
  <text x="827" y="378" font-size="8.3" fill="#898781">list to validate</text>
  <text x="900" y="402" text-anchor="end" font-size="10" font-weight="700" fill="#7d8a4a">C9</text>

  <!-- ================= C10 Authorization (Tier 2) ================= -->
  <rect x="916" y="300" width="94" height="110" rx="9" fill="#ffffff" stroke="#8b5e3c" stroke-width="1.8"/>
  <rect x="916" y="300" width="6" height="110" rx="3" fill="#8b5e3c"/>
  <text x="929" y="320" font-size="11" font-weight="700" fill="#0b0b0b">AUTHORIZATION</text>
  <text x="929" y="335" font-size="8.7" fill="#52514e">Python &#183; 2-10 repl.</text>
  <text x="929" y="352" font-size="9" font-weight="650" fill="#8b5e3c">checks every call</text>
  <text x="929" y="365" font-size="8.3" fill="#898781">gateway asks it before</text>
  <text x="929" y="378" font-size="8.3" fill="#898781">proxying anywhere</text>
  <text x="1002" y="402" text-anchor="end" font-size="10" font-weight="700" fill="#8b5e3c">C10</text>

  <!-- ============ internal service-to-service REST calls (dashed, Tier 1 only shown for clarity) ============ -->
  <line x1="366" y1="352" x2="354" y2="352" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>
  <path d="M 400 410 L 400 420 L 140 420 L 140 412" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>
  <text x="408" y="431" font-size="9" fill="#898781">optimizer &#8594; price, ingest (internal REST, over Kubernetes DNS)</text>

  <!-- ================= C11 MongoDB ================= -->
  <rect x="20" y="440" width="216" height="130" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/>
  <rect x="20" y="440" width="6" height="130" rx="3" fill="#52514e"/>
  <text x="34" y="463" font-size="12.5" font-weight="700" fill="#0b0b0b">MONGODB</text>
  <text x="34" y="480" font-size="10.5" fill="#52514e">StatefulSet &#183; 1 replica</text>
  <text x="34" y="496" font-size="9.5" fill="#898781">one shared instance;</text>
  <text x="34" y="509" font-size="9.5" fill="#898781">service-owned collections,</text>
  <text x="34" y="522" font-size="9.5" fill="#898781">not one database each</text>
  <text x="222" y="463" text-anchor="end" font-size="10.5" font-weight="700" fill="#52514e">C11</text>

  <rect x="128" y="536" width="98" height="26" rx="6" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="177" y="553" text-anchor="middle" font-size="10" font-weight="650" fill="#0b0b0b">PVC &#183; 2 GiB</text>

  <!-- ingest + auth -> mongo (only the two collection owners) -->
  <path d="M 70 410 L 70 428 L 90 440" fill="none" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 186 410 L 186 428 L 160 440" fill="none" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="242" y="450" font-size="10.5" fill="#52514e">mongodb :27017 &#8212; only pods labelled</text>
  <text x="242" y="464" font-size="10.5" fill="#52514e">app:ingest or app:auth may connect</text>
  <text x="242" y="480" font-size="10.5" fill="#52514e">(enforced by NetworkPolicy, not just</text>
  <text x="242" y="494" font-size="10.5" fill="#52514e">convention)</text>

  <!-- ================= External band ================= -->
  <text x="24" y="626" font-size="12" font-weight="700" fill="#898781" letter-spacing="0.06em">EXTERNAL &#183; outside the cluster, HTTPS, no API key</text>

  <rect x="207" y="650" width="190" height="90" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="302" y="676" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">elprisetjustnu.se</text>
  <text x="302" y="695" text-anchor="middle" font-size="11.5" fill="#52514e">Swedish day-ahead spot prices</text>
  <text x="302" y="713" text-anchor="middle" font-size="11.5" fill="#52514e">public REST API</text>
  <text x="302" y="730" text-anchor="middle" font-size="10.5" fill="#898781">called by C3 Price</text>

  <rect x="562" y="650" width="190" height="90" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="657" y="676" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Open-Meteo</text>
  <text x="657" y="695" text-anchor="middle" font-size="11.5" fill="#52514e">hourly weather forecast</text>
  <text x="657" y="713" text-anchor="middle" font-size="11.5" fill="#52514e">public REST API</text>
  <text x="657" y="730" text-anchor="middle" font-size="10.5" fill="#898781">called by C6 Forecast</text>

  <!-- price -> elprisetjustnu -->
  <line x1="302" y1="410" x2="302" y2="648" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#arrowgreen)"/>
  <rect x="310" y="570" width="52" height="19" rx="4" fill="#f7f9fc"/>
  <text x="314" y="584" font-size="10.5" font-weight="650" fill="#1baf7a">HTTPS</text>

  <!-- forecast -> open-meteo -->
  <line x1="657" y1="410" x2="657" y2="648" stroke="#0e9aa7" stroke-width="1.8" marker-end="url(#arrowteal)"/>
  <rect x="665" y="570" width="52" height="19" rx="4" fill="#ffffff"/>
  <text x="669" y="584" font-size="10.5" font-weight="650" fill="#0e9aa7">HTTPS</text>

  <!-- ================= Legend ================= -->
  <line x1="24" y1="762" x2="1016" y2="762" stroke="#e1e0d9" stroke-width="1"/>
  <text x="24" y="780" font-size="11" fill="#898781">Solid = request path &#183; Dashed = internal service-to-service REST calls &#183; Only C1 is reachable from outside the cluster &#183; Only C3 and C6 may reach the public internet &#183; Only C2 and C7 may reach MongoDB</text>
  <text x="24" y="797" font-size="11" fill="#898781">Roles are self-declared at registration: "staff" (read + write) or "viewer" (read-only), enforced by C10 &#183; Docker Desktop's default CNI does not enforce the NetworkPolicy objects shown above</text>
  <text x="24" y="812" font-size="10" fill="#898781">Not drawn for legibility: assistant (C5) also reads C3 and C4; forecast (C6) also reads C4; validation (C9) also reads C2; verification (C8) and auth (C7) call each other. Full call graph: README.md / docs/01-REPORT.md.</text>
</svg>
