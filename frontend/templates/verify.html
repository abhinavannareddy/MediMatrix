<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1f6feb 0, #141414 40%, #050505 100%);
            color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            border-radius: 1.2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            background: #111827;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }
        .card-header { border-bottom: 1px solid rgba(148, 163, 184, 0.25); }
        .form-label { font-weight: 500; color: #e5e7eb; }
        .form-control {
            background-color: #020617;
            border-color: #374151;
            color: #e5e7eb;
        }
        .form-control:focus {
            background-color: #020617;
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.15rem rgba(59, 130, 246, 0.4);
            color: #e5e7eb;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
        .helper-text { font-size: 0.85rem; color: #9ca3af; }
        a { color: #60a5fa; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-xl-4">
            <div class="card">
                <div class="card-header bg-transparent pt-3 pb-2 px-4">
                    <h1 class="h4 mb-1 text-white">Verify Your Account</h1>
                    <p class="mb-0 helper-text">
                        This demo has no mail server, so your one-time code is shown below
                        instead of being emailed.
                    </p>
                </div>
                <div class="card-body px-4 pb-4 pt-3">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    {% if prefill_code %}
                        <div class="alert alert-info">Your verification code: <strong>{{ prefill_code }}</strong></div>
                    {% endif %}
                    <form method="POST">
                        <input type="hidden" name="user_id" value="{{ user_id }}">
                        <div class="mb-3">
                            <label class="form-label" for="code">Verification Code</label>
                            <input type="text" class="form-control" id="code" name="code" value="{{ prefill_code }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2 py-2">Verify</button>
                    </form>
                    <p class="helper-text mt-3 mb-0">
                        Already verified? <a href="{{ url_for('login') }}">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
